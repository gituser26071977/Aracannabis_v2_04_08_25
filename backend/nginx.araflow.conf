# AraFlow Web — nginx configuration for the unprivileged image.
#
# Serves the react-native-web bundle (built into /usr/share/nginx/html
# by the Dockerfile) and reverse-proxies /health to the araflow-api
# container so the health endpoint is reachable on the same port Traefik
# already routes to.
#
# Security headers applied to every response (nginx adds headers last,
# so they take precedence over upstream). CSP is tight: connect-src
# limits outbound to the AraFlow domain and the AraOS API.
#
# Compression: gzip on for text assets; pre-compressed brotli would be
# faster but requires a build step nginx-unprivileged does not have.

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers — applied to every response.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self' https://flow.arapath.com.br; frame-ancestors 'none'; base-uri 'self'" always;

  # gzip — covers the RNW bundle (plain JS + JSON + HTML).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    font/ttf
    font/otf
    image/svg+xml;

  # Health endpoint — proxied to the API container on the araflow-internal
  # network. Resolved by Docker DNS (araflow-api resolves to the
  # container's IP on that network).
  location = /health {
    access_log off;
    proxy_pass http://araflow-api:5005/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
  }

  # Immutable cache for content-hashed assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback — every unknown path serves index.html so RNW can
  # client-side route (future-proofing; current MVP has no routing).
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }

  # Hide hidden files (.git, .env, etc.) and dotfiles.
  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }
}