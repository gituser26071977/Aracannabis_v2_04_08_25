version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:13
    container_name: aracannabis_db
    environment:
      POSTGRES_DB: aracannabis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Backend Flask Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aracannabis_backend
    ports:
      - "5002:5002"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aracannabis
      - JWT_SECRET_KEY=super_secret_key_12345
      - SECRET_KEY=another_super_secret_key_67890
      - DEBUG=True
    volumes:
      - .:/app
    depends_on:
      - db
    networks:
      - app-network
    command: ["gunicorn", "--bind", "0.0.0.0:5002", "--reload", "app_cors_livre:create_app()"]

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aracannabis_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:5002
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
