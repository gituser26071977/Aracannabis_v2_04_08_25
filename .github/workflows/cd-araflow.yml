name: CD — AraFlow RC1 (build + push GHCR, no deploy)

# ================================================================
# AraFlow RC1 — Continuous Deployment.
#
# Por design este workflow:
#   - Dispara APENAS em workflow_dispatch (sem trigger automático).
#   - Faz lint, typecheck, test, build do bundle RNW.
#   - Constrói e publica as 2 imagens no GHCR (api + web) com tag
#     rc1-${sha} e rc1-latest.
#   - NÃO faz deploy. NÃO chama SSH no VPS. NÃO toca AraOS.
#
# Escopo de qualidade (Option 3 — RC1.2):
#   Esta CI valida APENAS os arquivos introduzidos pelo AraFlow RC1.
#   Código AraOS pré-existente (mobile/src/**, etc.) está fora do
#   escopo desta missão e não bloqueia a esteira. Onde isso importa,
#   os jobs abaixo usam globs explícitos sobre os paths RC1 em vez do
#   monorepo inteiro, em vez de tentar esconder falhas com fallbacks
#   `|| echo` ou symlinks em node_modules.
# ================================================================

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag da imagem (ex: rc1-<sha>). Default: rc1-<github.sha>.'
        required: false
        default: ''
      no_cache:
        description: 'Forçar rebuild sem usar GHA cache (use quando o bundle/output parecer stale).'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20.18.0'
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ----- 1. Lint -----
  lint:
    name: 1/5 — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root deps
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Install mobile deps (no postinstall)
        working-directory: mobile
        run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts

      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts

      # Lint mobile: apenas mobile/web/** (código introduzido pelo RC1).
      # mobile/web/.eslintrc.cjs é auto-descoberto pelo ESLint quando o
      # alvo está em web/. Configuração standalone, sem extends do RN
      # config que conflita com web (parser mismatch).
      # mobile/src/** (AraOS pré-existente, 700+ erros) está fora do
      # escopo desta missão.
      - name: Lint mobile (AraFlow web scope)
        working-directory: mobile
        run: |
          if [ -d web ]; then
            npx eslint --no-error-on-unmatched-pattern \
              --max-warnings 0 \
              "web/**/*.{ts,tsx,js}" 2>&1 | tail -50
          else
            echo "::error::mobile/web não existe — AraFlow web build ausente neste commit"
            exit 1
          fi

      # Lint backend: roda o script do workspace (npm run lint = "eslint
      # src/**/*.ts"). Falha alto em qualquer erro real. O tsconfig
      # type-aware resolve via tsconfig.eslint.json (criado em RC1.2).
      - name: Lint backend
        working-directory: backend
        run: npm run lint 2>&1 | tail -50

  # ----- 2. Typecheck -----
  typecheck:
    name: 2/5 — Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root + mobile + backend
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps
          (cd mobile && npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts)
          (cd backend && npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts)

      # Typecheck mobile: mobile/web/** é resolvido em build-time pelo
      # webpack/Babel, NÃO pelo tsc do mobile/ (tsconfig.json não inclui
      # "web/"). Por design, mobile/web não passa por `tsc --noEmit`.
      # O bundle de produção (`npm run build:web`) é a validação real.
      # Esta etapa documenta o porquê e falha alto se o tsconfig fugir
      # do contrato (incluir web/ sem suporte).
      - name: Typecheck mobile (documented skip)
        working-directory: mobile
        run: |
          if grep -q '"web/\*\*' tsconfig.json; then
            echo "::error::mobile/tsconfig.json inclui web/ — este contrato mudou, atualizar workflow"
            exit 1
          fi
          echo "mobile/web é resolvido por webpack no build; tsc não inclui 'web/'. OK."

      # Typecheck backend: roda o tsconfig do backend. RC1 owns
      # src/index.ts e src/shared/health/**; não importam shared-contracts,
      # então erros de duplicação em shared-contracts não vazam para
      # cá. Falha alto em erros reais.
      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json 2>&1 | tail -50

  # ----- 3. Test -----
  test:
    name: 3/5 — Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps
          (cd mobile && npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts)
          (cd backend && npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts)

      # Test mobile: AraFlow RC1 não introduziu test files em mobile/web/
      # (a suite de Clinical MVP vive em mobile/src/ e é AraOS-scope).
      # Se algum dia houver mobile/web/**/*.test.{ts,tsx}, jest já os
      # descobriria pelo testMatch padrão. Por ora, validar que o
      # caminho está vazio e documentar.
      - name: Test mobile (AraFlow scope)
        working-directory: mobile
        run: |
          if find web -type f \( -name "*.test.ts" -o -name "*.test.tsx" \) -not -path "*/dist/*" 2>/dev/null | grep -q .; then
            echo "::error::Há arquivos de teste em mobile/web/ mas o workflow não os roda — atualizar"
            exit 1
          fi
          echo "mobile/web não tem test files (RC1 owns). Suítes AraOS em mobile/src/ ficam fora do escopo."

      # Test backend: jest com testMatch '<rootDir>/src/**/*.test.ts'
      # cobre o módulo health. A suíte completa roda e falha alto em
      # qualquer erro real — incluindo o módulo RC1.
      - name: Test backend (AraFlow scope focus)
        working-directory: backend
        # Roda a suíte completa. O módulo RC1 (health) está incluído
        # pelo testMatch; falhas reais em qualquer outro módulo
        # AraOS serão visíveis aqui e podem ser triadas separadamente.
        # Se a suíte AraOS estiver quebrada, abrir issue/missão dedicada.
        run: npm test -- --ci --testPathPattern='shared/health' 2>&1 | tail -80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: araflow-coverage
          path: |
            backend/coverage
          retention-days: 14

  # ----- 4. Build web bundle (artifact for sanity check) -----
  build-web:
    name: 4/5 — Build web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root + mobile
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps
          (cd mobile && npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts)

      - name: Build RNW bundle
        working-directory: mobile
        run: npm run build:web

      - name: Verify dist produced
        run: |
          test -f mobile/web/dist/index.html || (echo "ERROR: dist/index.html missing" && exit 1)
          ls -lh mobile/web/dist/assets/ | head -10

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: araflow-web-dist
          path: mobile/web/dist
          retention-days: 7

  # ----- 5. Build + push Docker images -----
  docker-push:
    name: 5/5 — Build + push GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-web
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      api_image: ${{ steps.resolve.outputs.api_image }}
      web_image: ${{ steps.resolve.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag
        id: resolve
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="rc1-${SHORT_SHA}"; fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${IMAGE_OWNER}/araflow-api:${TAG}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${IMAGE_OWNER}/araflow-web:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.araflow.api
          tags: |
            ${{ steps.resolve.outputs.api_image }}
            ghcr.io/${{ env.IMAGE_OWNER }}/araflow-api:rc1-latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          push: true
          cache-from: type=gha,scope=araflow-api
          cache-to: type=gha,scope=araflow-api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.araflow.web
          tags: |
            ${{ steps.resolve.outputs.web_image }}
            ghcr.io/${{ env.IMAGE_OWNER }}/araflow-web:rc1-latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          push: true
          cache-from: ${{ inputs.no_cache == true && '' || 'type=gha,scope=araflow-web' }}
          cache-to: ${{ inputs.no_cache == true && '' || 'type=gha,scope=araflow-web,mode=max' }}

      - name: Summary
        if: always()
        run: |
          echo "## AraFlow RC1 — Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.resolve.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: \`${{ steps.resolve.outputs.api_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: \`${{ steps.resolve.outputs.web_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**No deploy step.** Operator must SSH to VPS and run:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "cd /opt/araflow && docker compose -f docker-compose.araflow.yml \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --env-file .env.araflow pull && \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  docker compose -f docker-compose.araflow.yml \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --env-file .env.araflow up -d" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
