# NGINX com IP real via Cloudflare (CF-Connecting-IP)

set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
real_ip_header CF-Connecting-IP;

# Formato de log que registra o IP real do visitante (não o IP da Cloudflare)
log_format cf_real '$remote_addr [$time_local] CF:"$http_cf_connecting_ip" "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name arapath.com.br www.arapath.com.br;
    client_max_body_size 25M;

    access_log /var/log/nginx/access.log cf_real;

    # API Backend
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Autenticação
    location /auth/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhooks
    location /webhooks/ {
        proxy_pass http://api:8000/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mídia (cache longo)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff2)$ {
        root /var/www/frontend;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Frontend SPA
    location / {
        root /var/www/frontend;
        try_files $uri /index.html;
    }
}
