# ================================================================
# AraOS — Alertmanager (MISSÃO 20)
# Encaminha para Slack + PagerDuty + email
# ================================================================
global:
  resolve_timeout: 5m

route:
  receiver: 'slack-default'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true
    - match:
        severity: high
      receiver: 'slack-high'
      continue: true
    - match:
        severity: medium
      receiver: 'slack-default'

receivers:
  - name: 'slack-default'
    slack_configs:
      - api_url: https://hooks.slack.com/services/CHANGE_ME
        channel: '#araos-alerts'
        title: 'AraOS Alert'
        text: '{{ .CommonAnnotations.summary }}'

  - name: 'slack-high'
    slack_configs:
      - api_url: https://hooks.slack.com/services/CHANGE_ME
        channel: '#araos-incidents'
        title: '🔴 HIGH — AraOS'

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: 'CHANGE_ME_PAGERDUTY_KEY'
        description: '{{ .CommonAnnotations.summary }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'high'
    equal: ['alertname', 'instance']
